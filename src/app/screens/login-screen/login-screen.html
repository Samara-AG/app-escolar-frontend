<section class="login-new">
  <div class="login-container">
    <!-- Section left: Form-->
    <div class="login-form-section">
      <div class="login-brand">
        <img src="/assets/images/escudoB.png" alt="Logo BUAP" class="logo-buap">
        <span class="brand-title">Sistema Escolar</span>
      </div>
      <h2 class="login-title">Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa los datos que registraste</p>
      <!-- Formulario de inicio de sesión -->
      <form (ngSubmit)="login()" class="login-form" #form="ngForm">
        <!-- Campo de Correo Electrónico -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="username" [(ngModel)]="username" required
            placeholder="nombre@correo.com" class="form-control" autocomplete="username" />
          @if (errors.username) {
          <div class="invalid-feedback">{{ errors.username }}</div>
          }
        </div>
        <!-- Campo de Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div style="position:relative">
            <input [type]="typeInput" id="password" name="password_user" [(ngModel)]="password" required
              class="form-control" autocomplete="current-password" placeholder="Ingresa tu contraseña"
              (keyup.enter)="login()" style=" padding-right: 40px;" />
            <span class="show-password" (click)="showPassword()" style=" position:absolute; right:18px; top:50%;
              transform:translateY(-50%);">
              <i [ngClass]="typeInput == 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash'"></i>
            </span>
          </div>
          @if (errors.password) {
          <div class="invalid-feedback">{{ errors.password }}</div>
          }
        </div>
        <!-- Label de Olvidé mi Contraseña -->
        <div class="form-group">
          <a (click)="olvideContrasena()">¿Olvidaste tu contraseña?</a>
        </div>
        <!-- Botón de Iniciar Sesión -->
        <button type="submit" class="btn btn-primary" [disabled]="load">Iniciar Sesión</button>

      </form>
    </div>
    <!-- Section right: Illustration -->
    <div class="login-illustration-section">
      <div class="welcome-message">
        <h3>Bienvenido al Sistema Escolar</h3>
        <p>Gestiona tus actividades académicas de manera eficiente y sencilla</p>
      </div>
      <img src="/assets/images/buap-fcc.jpg" alt="Ilustración de bienvenida" class="login-illustration">
    </div>
  </div>
</section>
